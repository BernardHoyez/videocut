<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f13">
  <meta name="description" content="VideoCut — Découpe rapide de séquences vidéo dans le navigateur">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>VideoCut</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="M10 9l5 3-5 3V9z"/>
        </svg>
        <h1>VideoCut</h1>
      </div>
      <div class="header-actions">
        <button id="btn-new" class="btn btn-ghost" title="Nouveau projet" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </header>

    <main>
      <!-- Zone d'import -->
      <section id="drop-zone" class="drop-zone">
        <div class="drop-content">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <h2>Glissez-déposez une vidéo</h2>
          <p>MP4 · WebM · MOV · MKV · et plus</p>
          <label class="btn btn-primary">
            Sélectionner un fichier
            <input type="file" id="file-input" accept="video/*,.mkv,.mov,.avi,.m4v" hidden>
          </label>
        </div>
      </section>

      <!-- Éditeur -->
      <section id="editor" class="editor" hidden>
        <!-- Lecteur principal (rush) -->
        <div class="panel panel-rush">
          <div class="panel-header">
            <span class="panel-title">Rush intégral</span>
            <span id="rush-time" class="time-display">00:00.000</span>
          </div>
          <div class="video-wrap">
            <video id="video-rush" playsinline></video>
            <div class="video-overlay" id="rush-overlay">
              <button id="btn-play-rush" class="btn-play" title="Lecture / Pause">
                <svg class="icon-play" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                <svg class="icon-pause" width="32" height="32" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/></svg>
              </button>
            </div>
          </div>
          <div class="controls">
            <button id="btn-stop-rush" class="btn btn-sm" title="Arrêt">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12"/></svg>
            </button>
            <input type="range" id="rush-seek" min="0" max="1000" value="0" step="1" class="seek-bar">
            <span id="rush-duration" class="time-display small">00:00.000</span>
          </div>
        </div>

        <!-- Points de coupe -->
        <div class="cut-points">
          <!-- Début -->
          <div class="panel panel-cut">
            <div class="panel-header">
              <span class="panel-title">Début du cut</span>
              <span id="start-time" class="time-display accent">00:00.000</span>
            </div>
            <div class="frame-preview">
              <canvas id="canvas-start"></canvas>
            </div>
            <div class="frame-controls">
              <button id="btn-start-minus" class="btn btn-sm" title="-1 image">−1</button>
              <input type="range" id="start-seek" min="0" max="1000" value="0" step="1" class="seek-bar">
              <button id="btn-start-plus" class="btn btn-sm" title="+1 image">+1</button>
            </div>
            <button id="btn-set-start" class="btn btn-outline btn-block">Utiliser position actuelle</button>
          </div>

          <!-- Fin -->
          <div class="panel panel-cut">
            <div class="panel-header">
              <span class="panel-title">Fin du cut</span>
              <span id="end-time" class="time-display accent">00:00.000</span>
            </div>
            <div class="frame-preview">
              <canvas id="canvas-end"></canvas>
            </div>
            <div class="frame-controls">
              <button id="btn-end-minus" class="btn btn-sm" title="-1 image">−1</button>
              <input type="range" id="end-seek" min="0" max="1000" value="1000" step="1" class="seek-bar">
              <button id="btn-end-plus" class="btn btn-sm" title="+1 image">+1</button>
            </div>
            <button id="btn-set-end" class="btn btn-outline btn-block">Utiliser position actuelle</button>
          </div>
        </div>

        <!-- Aperçu du cut -->
        <div class="panel panel-preview">
          <div class="panel-header">
            <span class="panel-title">Aperçu du cut</span>
            <span id="cut-duration" class="time-display">00:00.000</span>
          </div>
          <div class="video-wrap">
            <video id="video-preview" playsinline></video>
            <div class="video-overlay" id="preview-overlay">
              <button id="btn-play-preview" class="btn-play" title="Lire le segment">
                <svg class="icon-play" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                <svg class="icon-pause" width="32" height="32" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/></svg>
              </button>
            </div>
          </div>
          <div class="preview-actions">
            <button id="btn-export" class="btn btn-primary btn-block" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              Exporter le cut (.mp4)
            </button>
            <div id="export-progress" class="progress" hidden>
              <div class="progress-bar" id="progress-bar"></div>
              <span id="progress-text">Préparation…</span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>VideoCut · Découpe locale · Aucune donnée envoyée</p>
    </footer>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="js/ffmpeg.min.js"></script>
  <script src="js/ffmpeg-util.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
        .then(reg => {
          reg.update();
          // Force check for updates periodically
          setInterval(() => reg.update(), 60 * 60 * 1000);
        })
        .catch(err => console.warn('SW registration failed', err));
    }
  </script>
</body>
</html>
